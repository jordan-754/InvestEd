<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>InvestEd – Set Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    .input-group { position: relative; }

    .input, select {
      width: 100%;
      padding: 0.75rem 2.75rem;
      border-radius: 0.5rem;
      border: 1px solid #d1d5db;
      transition: 0.2s;
      background: white;
    }

    .input:hover, select:hover {
      border-color: #16a34a;
      background-color: #f0fdf4;
    }

    .input:focus, select:focus {
      outline: none;
      border-color: #16a34a;
      box-shadow: 0 0 0 3px rgba(22,163,74,0.25);
    }

    .input-icon {
      position: absolute;
      top: 50%;
      left: 0.75rem;
      transform: translateY(-50%);
      color: #9ca3af;
      pointer-events: none;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 0.75rem;
      transform: translateY(-50%);
      cursor: pointer;
      color: #6b7280;
    }

    .toggle-password:hover {
      color: #16a34a;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center px-4
             bg-gradient-to-br from-green-50 to-emerald-100
             text-gray-900">

<!-- ===== CARD ===== -->
<div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-xl text-center">

  <!-- LOGO -->
  <img src="../../assets/logo.png" class="w-20 mx-auto mb-4" alt="InvestEd logo" />

  <h2 class="text-2xl font-bold">Welcome User!</h2>
  <p class="mt-2 mb-6 px-4 py-2 bg-green-200 text-green-900 rounded-md text-sm">
    Please fill the form to complete your registration
  </p>

  <h3 class="font-semibold mb-4 text-lg">Set Password</h3>

  <!-- FORM -->
  <form id="setPasswordForm" class="space-y-4">

    <!-- EMAIL -->
    <div class="text-left">
      <label class="text-sm">Email</label>
      <div class="input-group">
        <i data-lucide="mail" class="input-icon w-5 h-5"></i>
        <input id="email" type="email" class="input" placeholder="you@example.com" required />
      </div>
    </div>

    <!-- OTP -->
    <div id="resetCodeSection" class="text-left">
      <label class="text-sm">Reset Code</label>
      <div class="input-group">
        <i data-lucide="key-round" class="input-icon w-5 h-5"></i>
        <input id="otp" type="text" class="input" placeholder="Paste code from reset link (auto-filled if opened from email)" />
      </div>
      <button id="sendOtpBtn" type="button" class="mt-2 text-sm font-semibold text-green-600 hover:underline">
        Send Reset Email
      </button>
    </div>

    <!-- PASSWORD -->
    <div class="text-left">
      <label class="text-sm">Password</label>
      <div class="input-group">
        <i data-lucide="lock" class="input-icon w-5 h-5"></i>
        <input id="password" type="password" class="input" required />
        <i id="togglePassword" data-lucide="eye" class="toggle-password w-5 h-5"></i>
      </div>
    </div>

    <!-- CONFIRM PASSWORD -->
    <div class="text-left">
      <label class="text-sm">Confirm Password</label>
      <div class="input-group">
        <i data-lucide="lock" class="input-icon w-5 h-5"></i>
        <input id="confirmPassword" type="password" class="input" required />
      </div>
    </div>

    <p id="formMessage" class="text-sm text-center"></p>

    <!-- SUBMIT -->
    <button type="submit"
      class="w-full mt-4 bg-green-500 hover:bg-green-600 text-white py-3 rounded-lg font-semibold transition">
      Confirm
    </button>
  </form>

  <p class="mt-6 text-sm">
    Already have an account?
    <a href="login.html" class="text-green-600 font-semibold hover:underline">
      Log In
    </a>
  </p>
</div>

<script type="module">
  import {
    sendPasswordResetEmail,
    verifyPasswordResetCode,
    confirmPasswordReset
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { auth } from "../../js/firebase.js";

  lucide.createIcons();

  const form = document.getElementById("setPasswordForm");
  const emailInput = document.getElementById("email");
  const otpInput = document.getElementById("otp");
  const passwordInput = document.getElementById("password");
  const confirmPasswordInput = document.getElementById("confirmPassword");
  const sendOtpBtn = document.getElementById("sendOtpBtn");
  const formMessage = document.getElementById("formMessage");
  const resetCodeSection = document.getElementById("resetCodeSection");

  const urlParams = new URLSearchParams(window.location.search);
  const oobCodeFromUrl = urlParams.get("oobCode") || "";

  if (oobCodeFromUrl) {
    otpInput.value = oobCodeFromUrl;
    resetCodeSection.classList.add("hidden");
    setMessage("Reset link detected. Set your new password below.", false);
  }

  function setMessage(message, isError) {
    formMessage.textContent = message;
    formMessage.className = isError
      ? "text-sm text-center text-red-600"
      : "text-sm text-center text-green-600";
  }

  document.getElementById("togglePassword").addEventListener("click", () => {
    const isPassword = passwordInput.type === "password";
    passwordInput.type = isPassword ? "text" : "password";
  });

  sendOtpBtn.addEventListener("click", async () => {
    const email = emailInput.value.trim();
    if (!email) {
      setMessage("Enter your email first.", true);
      return;
    }

    try {
      await sendPasswordResetEmail(auth, email);
      setMessage("Reset email sent. Open the link from your email, then set your new password here.", false);
    } catch (error) {
      setMessage(error?.code === "auth/user-not-found"
        ? "No account found for that email."
        : "Unable to send reset email right now.", true);
    }
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = emailInput.value.trim();
    const otp = otpInput.value.trim() || oobCodeFromUrl;
    const password = passwordInput.value;
    const confirmPassword = confirmPasswordInput.value;

    if (!email || !password || !confirmPassword) {
      setMessage("Please complete all fields.", true);
      return;
    }

    if (!otp) {
      setMessage("Open the password reset link from your email, or paste its code in Reset Code.", true);
      return;
    }

    if (password.length < 8) {
      setMessage("Password must be at least 8 characters.", true);
      return;
    }

    if (password !== confirmPassword) {
      setMessage("Passwords do not match.", true);
      return;
    }

    try {
      const resolvedEmail = await verifyPasswordResetCode(auth, otp);
      if (resolvedEmail.toLowerCase() !== email.toLowerCase()) {
        setMessage("The reset code belongs to a different email.", true);
        return;
      }

      await confirmPasswordReset(auth, otp, password);
      setMessage("Password reset successful. Redirecting to login...", false);
      setTimeout(() => {
        window.location.href = "login.html";
      }, 1000);
    } catch (error) {
      setMessage(
        error?.code === "auth/expired-action-code"
          ? "This reset link has expired. Request a new one."
          : error?.code === "auth/invalid-action-code"
            ? "Invalid reset link/code. Request a new one."
            : "Unable to reset password right now.",
        true
      );
    }
  });
</script>

</body>
</html>
